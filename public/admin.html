<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portfolio Admin</title><link rel="stylesheet" href="/style.css"></head><body><div class="admin-box"><header class="nav"><a class="logo" href="/">Ramanain<span>HYD.</span></a><a class="pill" href="/">View website ↗</a></header><h1>Portfolio dashboard</h1><p class="muted">Manage your public portfolio without editing code.</p><section class="panel" id="login"><h2>Admin sign in</h2><form id="login-form"><div class="field"><label for="admin-email">Admin email</label><input id="admin-email" type="email" required autocomplete="username"></div><div class="field"><label for="password">Admin password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary">Sign in</button></form></section><div id="dashboard" class="hide"><button class="btn" id="logout">Sign out</button><section class="panel"><h2>Profile & contact</h2><form id="profile-form"><div id="fields"></div><button class="btn primary">Save profile</button></form></section><section class="panel"><h2>Add a project</h2><p class="muted">Upload images or videos. Media is stored and optimized through Cloudinary (maximum depends on your Cloudinary plan).</p><form id="project-form"><div class="field"><label>Project title</label><input id="project-title" required maxlength="120"></div><div class="field"><label>Description</label><textarea id="project-description"></textarea></div><div class="field"><label>Photo or video</label><input type="file" id="project-file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" required></div><button class="btn primary" id="upload-btn">Upload & publish</button></form></section><section class="panel"><h2>Published projects</h2><div id="project-list"></div></section></div><p class="status" id="status" role="status" aria-live="polite"></p></div><script src="/admin.js"></script></body></html>
